<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>My CSS Practice Page</title>

    <style>

    body {
        font-family: Arial, sans-serif;
        color: #222222;
        background-color: lightgray;
    }

    header {
        font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        background-color: black;
        color: aqua;
        height: auto;
        text-align: center;
    }

    h1 {
        color:#222222;
    }

    h2 {
        color: bisque;
    }

    p {
        color: red;
    }

    nav {
        border:#222222;
    }

    nav ul {
        background-color: aqua;
    }

    nav a {
        text-decoration: dashed;
    }

    nav li {
        display: inline;
    }

    section {
        width: 600px;
        height: 200px;
        border: 2px solid black;
        background-color: white;
    }

    main {
        width: 800px;
    }   

    footer {
        background-color: black;
        color: aqua;
        text-align: center;
    }

    </style>

</head>

<body>

    <header></header>

    <nav>
        <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#">About</a></li>
        <li><a href="#">Favorites</a></li>
        <li><a href="#">Contact</a></li>
    </ul>
    </nav>

    <main>

        <section>

            <h1>Hello, World!</h1>
                <p>Hi.</p>

            <h2>Hello, World.</h2>
                <ul>
                    <li>Hi!</li>
                </ul>

        </section>

    </main>

    <footer>
        <h2>Created by Your Name</h2>
    </footer>

</body>

</html>

CSS and GitHub Reflection

1. What is the difference between HTML and CSS?
    HTML is a sort of 'building block' for a website, but CSS styles the website visually. '

2. What happened when you changed the width or height of an element?
     The space that the element holds changes.

3. How did CSS change the navigation from a normal HTML list into horizontal navigation?
    The text-align declaring changed it. 
4. Why is it useful to commit your work at different stages instead of making one commit at the end?
     You can go back to different versions, along with the fact that it keeps a history of how you built the site.
5. What is the difference between committing a change and pushing a change to GitHub?
    Committinng a change saves it on your device's repository, but pushing the origin also saves it on Github's website
